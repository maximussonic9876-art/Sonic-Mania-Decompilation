name: Build Mania

on:
  workflow_dispatch:
  push:
    paths:
      - dependencies/**
      - SonicMania/**
      - .github/workflows/build.yml
      - CMakeLists.txt
    branches:
      - master

permissions:
  contents: write

env:
  GENERAL_FLAGS: "-DWITH_RSDK=OFF -DMANIA_USE_PLUS=ON -DCMAKE_BUILD_TYPE=Release"
  V5U_FLAGS: "-DRETRO_REVISION=3"
  GENERAL_WIN_FLAGS: "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake"
  WIN64_FLAGS: "-DVCPKG_TARGET_TRIPLET=x64-windows-static -A x64"

jobs:
  mania-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build Mania
        run: |
          cmake -B build_v5U ${{env.GENERAL_FLAGS}} ${{env.GENERAL_WIN_FLAGS}} ${{env.WIN64_FLAGS}} ${{env.V5U_FLAGS}}
          cmake --build build_v5U --parallel --config Release
      - name: Upload raw Game.dll to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: ./build_v5U/Release/Game.dll
          overwrite: true
